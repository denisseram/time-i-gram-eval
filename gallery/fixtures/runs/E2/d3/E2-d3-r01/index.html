<!doctype html>
<html><head><meta charset="utf-8"><title>DEMO fixture</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script></head>
<body><h3>DEMO fixture: ARE consultations, Germany</h3><svg id="c" width="900" height="260"></svg>
<script>
// DEMO fixture for the gallery, not an agent output.
const parse = d3.utcParse("%G-W%V");
d3.tsv("https://raw.githubusercontent.com/robert-koch-institut/ARE-Konsultationsinzidenz/65ac2d278c06333808415795d65f0347c54be638/ARE-Konsultationsinzidenz.tsv").then(rows => {
  const data = rows.filter(d => d.Bundesland === "Bundesweit" && d.Altersgruppe === "00+")
    .map(d => ({ t: parse(d.Kalenderwoche), v: +d.ARE_Konsultationsinzidenz }));
  const svg = d3.select("#c"), m = { t: 10, r: 10, b: 30, l: 50 };
  const x = d3.scaleUtc(d3.extent(data, d => d.t), [m.l, 900 - m.r]);
  const y = d3.scaleLinear([0, d3.max(data, d => d.v)], [260 - m.b, m.t]).nice();
  svg.append("g").attr("transform", `translate(0,${260 - m.b})`).call(d3.axisBottom(x));
  svg.append("g").attr("transform", `translate(${m.l},0)`).call(d3.axisLeft(y));
  svg.append("path").datum(data).attr("fill", "none").attr("stroke", "steelblue")
    .attr("d", d3.line(d => x(d.t), d => y(d.v)));
});
</script></body></html>
