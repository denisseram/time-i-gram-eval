<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ubuntu release life cycles aligned on release date</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #222; background: #fff; }
  #wrap { padding: 12px 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  #caption { font-size: 13.5px; color: #444; margin: 0 0 6px; max-width: 1300px; }
  svg text { font-size: 10.5px; fill: #333; }
  .axis-title { font-size: 12px; font-weight: 600; }
  .panel-title { font-size: 12.5px; font-weight: 700; fill: #111; }
  .grid line { stroke: #e6e6e6; }
  .grid path { display: none; }
  .tooltip { position: absolute; pointer-events: none; background: #fff; border: 1px solid #bbb; border-radius: 4px; padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.15); display: none; }
</style>
</head>
<body>
<div id="wrap">
  <h1>Ubuntu life cycles aligned on release date: LTS releases share one long template, interim releases one short one</h1>
  <p id="caption"></p>
  <div id="chart"></div>
</div>
<div class="tooltip" id="tip"></div>
<script>
const URL = "https://raw.githubusercontent.com/denisseram/dataset-snapshots/3731e02e38c75e5d70ae92bf3596a69951866c2d/ubuntu.csv";
const parse = d3.timeParse("%Y-%m-%d");
const YEAR_MS = 365.2425 * 24 * 3600 * 1000;
const now = new Date();

const PHASES = [
  { key: "dev",    label: "Development (created → release)",            color: "#9aa5b1" },
  { key: "std",    label: "Standard support (release → eol)",            color: "#2a78c2" },
  { key: "server", label: "Extended server support (eol → eol-server)",  color: "#5bb08a" },
  { key: "esm",    label: "Expanded Security Maintenance (→ eol-esm)",   color: "#e3962b" },
  { key: "legacy", label: "Legacy support add-on (eol-esm → eol-legacy)", color: "#b04a6c" }
];
const color = Object.fromEntries(PHASES.map(p => [p.key, p.color]));

d3.csv(URL).then(raw => {
  const rows = raw.map(r => {
    const g = k => (r[k] && r[k].trim() !== "") ? parse(r[k].trim()) : null;
    const d = {
      version: r.version, codename: r.codename,
      created: g("created"), release: g("release"), eol: g("eol"),
      eolServer: g("eol-server"), eolEsm: g("eol-esm"), eolLegacy: g("eol-legacy"),
      lts: /LTS/.test(r.version)
    };
    const rel = d.release;
    const t = x => (x - rel) / YEAR_MS;
    const segs = [];
    const add = (key, a, b) => { if (a && b && b > a) segs.push({ key, a, b, x0: t(a), x1: t(b) }); };
    add("dev", d.created, d.release);
    add("std", d.release, d.eol);
    let prevEnd = d.eol;
    if (d.eolServer && d.eol && d.eolServer > d.eol) { add("server", d.eol, d.eolServer); prevEnd = d.eolServer; }
    if (d.eolEsm) { add("esm", prevEnd, d.eolEsm); }
    if (d.eolEsm && d.eolLegacy) add("legacy", d.eolEsm, d.eolLegacy);
    d.segs = segs;
    d.tNow = t(now);
    d.tCreated = d.created ? t(d.created) : null;
    d.end = d3.max(segs, s => s.x1) ?? 0;
    return d;
  }).filter(d => d.release).sort((a, b) => a.release - b.release);

  const groups = [
    { name: "LTS releases", rows: rows.filter(d => d.lts) },
    { name: "Interim releases", rows: rows.filter(d => !d.lts) }
  ];

  // ---- Caption, computed from the data ----
  const stdYears = d => d.eol ? (d.eol - d.release) / YEAR_MS : null;
  const medStdLts = d3.median(groups[0].rows, stdYears);
  const medStdInt = d3.median(groups[1].rows, stdYears);
  const medDev = d3.median(rows, d => d.created ? (d.release - d.created) / YEAR_MS : null);
  const fmt = v => d3.format(".1f")(v);
  const ltsMaxEnd = d3.max(groups[0].rows, d => d.end);
  const firstLegacy = groups[0].rows.find(d => d.eolLegacy);
  const firstEsm = groups[0].rows.find(d => d.eolEsm);
  const ints = groups[1].rows;
  const switchIdx = ints.findIndex(d => stdYears(d) < 1);
  const early = ints.slice(0, switchIdx), late = ints.slice(switchIdx);
  const mo = v => Math.round(v * 12);
  const ltsStd = d3.extent(groups[0].rows, stdYears);
  const esmEnd = d3.max(groups[0].rows, d => d.eolEsm ? (d.eolEsm - d.release) / YEAR_MS : null);
  d3.select("#caption").text(
    `Aligned on release, all releases share a ~${mo(medDev)}-month development phase, but life cycles follow two fixed templates: ` +
    `interim releases get ~${mo(d3.median(early, stdYears))} months of support up to ${early[early.length-1].version} and ~${mo(d3.median(late, stdYears))} months from ${late[0].version}, ` +
    `while LTS releases get ${Math.round(ltsStd[0])}–${Math.round(ltsStd[1])} years of standard support, stretched to ~${Math.round(esmEnd)} years by ESM (from ${firstEsm.version}) ` +
    `and ~${Math.round(ltsMaxEnd)} years by the Legacy add-on (from ${firstLegacy.version}).`
  );

  // ---- Layout ----
  const W = 1350, rowH = 13, panelGap = 34;
  const margin = { top: 8, right: 30, bottom: 44, left: 82 };
  const legendH = 44;
  const panelHeights = groups.map(g => g.rows.length * rowH);
  const innerH = d3.sum(panelHeights) + panelGap * groups.length;
  const H = margin.top + legendH + innerH + margin.bottom;
  const innerW = W - margin.left - margin.right;

  const xMin = Math.floor(d3.min(rows, d => d.tCreated ?? 0));
  const xMax = Math.ceil(d3.max(rows, d => d.end));
  const x = d3.scaleLinear().domain([xMin, xMax]).range([0, innerW]);

  const svg = d3.select("#chart").append("svg").attr("width", W).attr("height", H)
    .attr("viewBox", `0 0 ${W} ${H}`);

  // Hatch pattern for planned (future) portions
  const defs = svg.append("defs");
  defs.append("pattern").attr("id", "future").attr("patternUnits", "userSpaceOnUse")
    .attr("width", 5).attr("height", 5).attr("patternTransform", "rotate(45)")
    .append("rect").attr("width", 2.2).attr("height", 5).attr("fill", "rgba(255,255,255,0.65)");

  // Legend
  const lg = svg.append("g").attr("transform", `translate(${margin.left},${margin.top + 10})`);
  let lx = 0;
  PHASES.forEach(p => {
    const g = lg.append("g").attr("transform", `translate(${lx},0)`);
    g.append("rect").attr("y", -8).attr("width", 16).attr("height", 10).attr("fill", p.color);
    const t = g.append("text").attr("x", 21).attr("y", 1).text(p.label);
    lx += 21 + t.node().getComputedTextLength() + 18;
  });
  lx = 0;
  {
    const g = lg.append("g").attr("transform", `translate(${lx},18)`);
    g.append("rect").attr("y", -8).attr("width", 16).attr("height", 10).attr("fill", "#2a78c2");
    g.append("rect").attr("y", -8).attr("width", 16).attr("height", 10).attr("fill", "url(#future)");
    const t = g.append("text").attr("x", 21).attr("y", 1).text("planned (after today)");
    lx += 21 + t.node().getComputedTextLength() + 18;
    const g2 = lg.append("g").attr("transform", `translate(${lx},18)`);
    g2.append("circle").attr("cx", 5).attr("cy", -3).attr("r", 3.2).attr("fill", "#fff").attr("stroke", "#333").attr("stroke-width", 1.3);
    g2.append("text").attr("x", 13).attr("y", 1).text("created");
    g2.append("line").attr("x1", 70).attr("x2", 70).attr("y1", -9).attr("y2", 3).attr("stroke", "#000").attr("stroke-width", 2);
    g2.append("text").attr("x", 76).attr("y", 1).text("release (0)");
  }

  const plot = svg.append("g").attr("transform", `translate(${margin.left},${margin.top + legendH})`);

  // Gridlines across full height
  plot.append("g").attr("class", "grid")
    .call(d3.axisBottom(x).ticks(xMax - xMin).tickSize(innerH).tickFormat(""));

  const tip = d3.select("#tip");
  const fmtDate = d3.timeFormat("%Y-%m-%d");

  let y0 = 0;
  groups.forEach((grp, gi) => {
    const g = plot.append("g").attr("transform", `translate(0,${y0 + panelGap - 8})`);
    g.append("text").attr("class", "panel-title").attr("x", -margin.left + 4).attr("y", -6)
      .text(`${grp.name} (n = ${grp.rows.length})`);
    const y = d3.scaleBand().domain(grp.rows.map(d => d.version)).range([0, grp.rows.length * rowH]).padding(0.22);

    g.append("g").call(d3.axisLeft(y).tickSize(0).tickPadding(6)).call(a => a.select(".domain").remove())
      .selectAll("text").style("font-weight", gi === 0 ? 600 : 400);

    const row = g.selectAll("g.row").data(grp.rows).join("g").attr("class", "row")
      .attr("transform", d => `translate(0,${y(d.version)})`);

    row.selectAll("rect.seg").data(d => d.segs.map(s => ({ ...s, d }))).join("rect").attr("class", "seg")
      .attr("x", s => x(s.x0)).attr("width", s => Math.max(0.5, x(s.x1) - x(s.x0)))
      .attr("height", y.bandwidth()).attr("fill", s => color[s.key])
      .on("mousemove", (ev, s) => {
        const p = PHASES.find(p => p.key === s.key);
        tip.style("display", "block").style("left", (ev.pageX + 12) + "px").style("top", (ev.pageY + 10) + "px")
          .html(`<b>${s.d.version}</b> ${s.d.codename}<br>${p.label}<br>${fmtDate(s.a)} → ${fmtDate(s.b)}<br>${d3.format(".2f")(s.x0)} to ${d3.format(".2f")(s.x1)} years`);
      })
      .on("mouseleave", () => tip.style("display", "none"));

    // Future overlay (hatched) from today onward
    row.filter(d => d.end > d.tNow).append("rect")
      .attr("x", d => x(Math.max(d.tNow, d3.min(d.segs, s => s.x0))))
      .attr("width", d => x(d.end) - x(Math.max(d.tNow, d3.min(d.segs, s => s.x0))))
      .attr("height", y.bandwidth()).attr("fill", "url(#future)").attr("pointer-events", "none");

    // Events: created (circle) and release (tick at 0)
    row.filter(d => d.tCreated !== null).append("circle")
      .attr("cx", d => x(d.tCreated)).attr("cy", y.bandwidth() / 2).attr("r", 3.2)
      .attr("fill", "#fff").attr("stroke", "#333").attr("stroke-width", 1.3);
    row.append("line").attr("x1", x(0)).attr("x2", x(0)).attr("y1", -1.5).attr("y2", y.bandwidth() + 1.5)
      .attr("stroke", "#000").attr("stroke-width", 2);

    y0 += panelGap + grp.rows.length * rowH;
  });

  // Release line
  plot.append("line").attr("x1", x(0)).attr("x2", x(0)).attr("y1", 0).attr("y2", innerH)
    .attr("stroke", "#000").attr("stroke-opacity", 0.25).attr("stroke-dasharray", "3,3");

  // X axis
  plot.append("g").attr("transform", `translate(0,${innerH})`)
    .call(d3.axisBottom(x).ticks(xMax - xMin).tickFormat(d => d === 0 ? "0 (release)" : (d > 0 ? "+" + d : d)));
  plot.append("text").attr("class", "axis-title").attr("x", innerW / 2).attr("y", innerH + 34)
    .attr("text-anchor", "middle").text("Time relative to the release's own release date (years)");
}).catch(err => {
  d3.select("#chart").append("p").style("color", "crimson").text("Failed to load data: " + err);
  console.error(err);
});
</script>
</body>
</html>
