<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wien Hohe Warte, 10-minute weather 2020–2024</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 14px 24px; color: #222; background: #fff; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  #caption { font-size: 14px; color: #444; margin: 0 0 6px; max-width: 1320px; }
  #status { font-size: 13px; color: #666; height: 18px; }
  svg text { fill: #333; }
  .axis text { font-size: 11px; }
  .axis-label { font-size: 12px; fill: #333; }
  .panel-title { font-size: 13px; font-weight: 600; fill: #222; }
  .band { fill: #e6550d; fill-opacity: 0.22; }
  .mean { fill: none; stroke: #c4430a; stroke-width: 1.2; }
  .raw { fill: none; stroke: #c4430a; stroke-width: 1.4; }
  .dot { fill: #c4430a; }
  .rain { fill: #2b6cb0; }
  .grid line { stroke: #e8e8e8; }
  .grid path { display: none; }
  .zero { stroke: #999; stroke-dasharray: 2 3; }
  .brush .selection { fill: #1f4e79; fill-opacity: .25; stroke: #1f4e79; stroke-width: 2; }
  .hint { font-size: 11px; fill: #777; }
  #tip { position: absolute; pointer-events: none; background: rgba(255,255,255,.95); border: 1px solid #bbb;
         padding: 4px 7px; font-size: 12px; border-radius: 3px; display: none; white-space: nowrap; }
  .foot { font-size: 11px; color: #777; }
</style>
</head>
<body>
<h1>Air temperature and precipitation at Wien Hohe Warte, 10-minute data, 2020–2024</h1>
<p id="caption">Loading data…</p>
<div id="status"></div>
<div id="chart"></div>
<div id="tip"></div>
<div class="foot">Data: GeoSphere Austria, klima-v2-10min, station 105 Wien Hohe Warte (CC BY 4.0). Times in UTC.
Brush the overview to choose a period; scroll/drag in the detail view to zoom/pan.</div>
<script>
const URL_DATA = "https://raw.githubusercontent.com/denisseram/dataset-snapshots/3731e02e38c75e5d70ae92bf3596a69951866c2d/geosphere_wien_10min_2020-2024.csv";
const W = 1350;
const M = {l: 64, r: 20};
const iw = W - M.l - M.r;
const OV = {top: 22, h: 150};          // overview
const DT = {top: OV.top + OV.h + 64, h: 300}; // detail temperature
const RR = {top: DT.top + DT.h + 18, h: 110};  // detail rain
const H = RR.top + RR.h + 40;
const STEP = 600000; // 10 min in ms
const BINS = [
  {ms: STEP, label: "10 min"}, {ms: 3 * STEP, label: "30 min"}, {ms: 6 * STEP, label: "1 h"},
  {ms: 18 * STEP, label: "3 h"}, {ms: 36 * STEP, label: "6 h"}, {ms: 72 * STEP, label: "12 h"},
  {ms: 144 * STEP, label: "1 day"}, {ms: 1008 * STEP, label: "7 days"}
];
const status = d3.select("#status");
const tip = d3.select("#tip");
const fmtFull = d3.utcFormat("%Y-%m-%d %H:%M UTC");

d3.text(URL_DATA).then(text => {
  status.text("Parsing…");
  const rows = d3.csvParse(text);
  const n = rows.length;
  const T = new Float64Array(n), TL = new Float64Array(n), R = new Float64Array(n);
  let missT = 0, missR = 0;
  for (let i = 0; i < n; i++) {
    const r = rows[i];
    T[i] = Date.parse(r.time.replace(/([+-]\d\d:\d\d)$/, ":00$1"));
    const t = r.tl === "" || r.tl == null ? NaN : +r.tl;
    const p = r.rr === "" || r.rr == null ? NaN : +r.rr;
    TL[i] = t; R[i] = p;
    if (isNaN(t)) missT++;
    if (isNaN(p)) missR++;
  }
  // ensure sorted
  for (let i = 1; i < n; i++) if (T[i] < T[i - 1]) { throw new Error("Data not sorted by time"); }
  build(n, T, TL, R, missT, missR);
}).catch(err => { status.text("Error: " + err.message); console.error(err); });

// aggregate into fixed UTC bins (aligned to epoch) between indices i0..i1
function aggregate(T, TL, R, i0, i1, binMs) {
  const out = [];
  let cur = null;
  for (let i = i0; i < i1; i++) {
    const b = Math.floor(T[i] / binMs) * binMs;
    if (!cur || cur.t !== b) {
      if (cur) out.push(fin(cur));
      cur = {t: b, min: Infinity, max: -Infinity, sum: 0, cnt: 0, rsum: 0, rcnt: 0, n: 0};
    }
    const v = TL[i];
    if (!isNaN(v)) { cur.sum += v; cur.cnt++; if (v < cur.min) cur.min = v; if (v > cur.max) cur.max = v; }
    const p = R[i];
    if (!isNaN(p)) { cur.rsum += p; cur.rcnt++; }
    cur.n++;
  }
  if (cur) out.push(fin(cur));
  return out;
  function fin(c) {
    return {t: c.t, t1: c.t + binMs, min: c.cnt ? c.min : NaN, max: c.cnt ? c.max : NaN,
            mean: c.cnt ? c.sum / c.cnt : NaN, rain: c.rcnt ? c.rsum : NaN, n: c.n};
  }
}

function build(n, T, TL, R, missT, missR) {
  const t0 = T[0], t1 = T[n - 1] + STEP;
  // ---------- caption statistics (computed) ----------
  const monthly = d3.rollups(d3.range(n).filter(i => !isNaN(TL[i])),
    v => d3.mean(v, i => TL[i]), i => d3.utcMonth.floor(new Date(T[i])).getTime())
    .sort((a, b) => a[0] - b[0]);
  const coldM = d3.least(monthly, d => d[1]), warmM = d3.greatest(monthly, d => d[1]);
  const daily = aggregate(T, TL, R, 0, n, 864e5);
  const meanDayRange = d3.mean(daily, d => d.max - d.min);
  const tmax = d3.greatest(d3.range(n), i => isNaN(TL[i]) ? -Infinity : TL[i]);
  const tmin = d3.least(d3.range(n), i => isNaN(TL[i]) ? Infinity : TL[i]);
  const rmax = d3.greatest(d3.range(n), i => isNaN(R[i]) ? -Infinity : R[i]);
  const wetShare = d3.sum(d3.range(n), i => R[i] > 0 ? 1 : 0) / (n - missR);
  const mf = d3.utcFormat("%B %Y"), f1 = d3.format(".1f");
  d3.select("#caption").html(
    `Temperature follows a strong annual cycle—monthly means range from ${f1(coldM[1])} °C (${mf(new Date(coldM[0]))}) ` +
    `to ${f1(warmM[1])} °C (${mf(new Date(warmM[0]))})—with a typical day-night swing of ${f1(meanDayRange)} °C, ` +
    `while rain falls in short bursts (only ${d3.format(".1%")(wetShare)} of 10-minute intervals are wet; ` +
    `peak ${f1(R[rmax])} mm on ${fmtFull(new Date(T[rmax]))}).`);
  status.text(`${d3.format(",")(n)} rows loaded (${fmtFull(new Date(T[0]))} – ${fmtFull(new Date(T[n-1]))}); ` +
    `missing: ${missT} tl, ${missR} rr. Extremes: ${f1(TL[tmin])} °C to ${f1(TL[tmax])} °C.`);

  const svg = d3.select("#chart").append("svg").attr("width", W).attr("height", H)
    .attr("viewBox", `0 0 ${W} ${H}`);
  svg.append("defs").append("clipPath").attr("id", "clip")
    .append("rect").attr("width", iw).attr("height", RR.top + RR.h - DT.top).attr("y", 0);

  // ---------- overview ----------
  const xo = d3.scaleUtc().domain([t0, t1]).range([0, iw]);
  const yT = [Math.floor(TL[tmin] / 5) * 5, Math.ceil(TL[tmax] / 5) * 5];
  const yo = d3.scaleLinear().domain(yT).range([OV.h, 0]);
  const go = svg.append("g").attr("transform", `translate(${M.l},${OV.top})`);
  go.append("text").attr("class", "panel-title").attr("y", -8)
    .text("Overview 2020–2024: daily min–max range (band) and daily mean (line) of air temperature");
  go.append("g").attr("class", "grid").call(d3.axisLeft(yo).ticks(5).tickSize(-iw).tickFormat(""));
  go.append("line").attr("class", "zero").attr("x1", 0).attr("x2", iw).attr("y1", yo(0)).attr("y2", yo(0));
  const defd = d => !isNaN(d.mean);
  go.append("path").datum(daily).attr("class", "band")
    .attr("d", d3.area().defined(defd).x(d => xo(d.t + 432e5)).y0(d => yo(d.min)).y1(d => yo(d.max)));
  go.append("path").datum(daily).attr("class", "mean").attr("stroke-width", 0.8)
    .attr("d", d3.line().defined(defd).x(d => xo(d.t + 432e5)).y(d => yo(d.mean)));
  go.append("g").attr("class", "axis").call(d3.axisLeft(yo).ticks(5));
  go.append("text").attr("class", "axis-label").attr("transform", "rotate(-90)")
    .attr("x", -OV.h / 2).attr("y", -42).attr("text-anchor", "middle").text("Air temp. (°C)");
  // overview axes: months (minor) + years (major)
  go.append("g").attr("class", "axis").attr("transform", `translate(0,${OV.h})`)
    .call(d3.axisBottom(xo).ticks(d3.utcMonth.every(3)).tickFormat(d3.utcFormat("%b")).tickSizeOuter(0));
  go.append("g").attr("class", "axis").attr("transform", `translate(0,${OV.h + 16})`)
    .call(d3.axisBottom(xo).tickValues(d3.utcYear.range(new Date(t0), new Date(t1 - 1))).tickSize(0).tickFormat(d3.utcFormat("%Y")))
    .call(g => g.select(".domain").remove())
    .call(g => g.selectAll("text").attr("font-weight", 600).attr("text-anchor", "start").attr("dx", 3));
  go.append("text").attr("class", "axis-label").attr("x", iw).attr("y", OV.h + 42).attr("text-anchor", "end")
    .text("Time (UTC)");

  // ---------- detail ----------
  const xd = d3.scaleUtc().domain([t0, t1]).range([0, iw]);
  const yd = d3.scaleLinear().range([DT.h, 0]);
  const yr = d3.scaleLinear().range([RR.h, 0]);
  const gd = svg.append("g").attr("transform", `translate(${M.l},${DT.top})`);
  const titleD = gd.append("text").attr("class", "panel-title").attr("y", -8);
  const gGridT = gd.append("g").attr("class", "grid");
  const gYT = gd.append("g").attr("class", "axis");
  gd.append("text").attr("class", "axis-label").attr("transform", "rotate(-90)")
    .attr("x", -DT.h / 2).attr("y", -42).attr("text-anchor", "middle").text("Air temperature 2 m (°C)");
  const plot = gd.append("g").attr("clip-path", "url(#clip)").attr("pointer-events", "none");
  const zeroD = plot.append("line").attr("class", "zero");
  const bandD = plot.append("path").attr("class", "band");
  const lineD = plot.append("path");
  const dotsD = plot.append("g");
  const rainG = plot.append("g").attr("transform", `translate(0,${RR.top - DT.top})`);
  const gr = gd.append("g").attr("transform", `translate(0,${RR.top - DT.top})`);
  const gGridR = gr.append("g").attr("class", "grid");
  const gYR = gr.append("g").attr("class", "axis");
  const rLabel = gr.append("text").attr("class", "axis-label").attr("transform", "rotate(-90)")
    .attr("x", -RR.h / 2).attr("y", -46).attr("text-anchor", "middle");
  gr.append("line").attr("x1", 0).attr("x2", iw).attr("y1", RR.h).attr("y2", RR.h).attr("stroke", "#999");
  const gX = gr.append("g").attr("class", "axis").attr("transform", `translate(0,${RR.h})`);
  gr.append("text").attr("class", "axis-label").attr("x", iw).attr("y", RR.h + 34).attr("text-anchor", "end")
    .text("Time (UTC)");
  const hintD = gd.append("text").attr("class", "hint").attr("x", iw).attr("y", -8).attr("text-anchor", "end");

  // UTC multi-scale tick format: years → months → days → hours:minutes
  const fYear = d3.utcFormat("%Y"), fMonth = d3.utcFormat("%b %Y"), fDay = d3.utcFormat("%a %d %b"),
        fHour = d3.utcFormat("%H:%M"), fDayHour = d3.utcFormat("%d %b %H:%M");
  function tickFmt(d) {
    if (d3.utcYear(d) < d) {
      if (d3.utcMonth(d) < d) {
        if (d3.utcDay(d) < d) return fHour(d);
        return fDay(d);
      }
      return fMonth(d);
    }
    return fYear(d);
  }

  function render() {
    const [a, b] = xd.domain().map(Number);
    const i0 = Math.max(0, d3.bisectLeft(T, a) - 1);
    const i1 = Math.min(n, d3.bisectRight(T, b) + 1);
    const span = b - a;
    // choose the finest bin with at most ~1 bin per 2 px
    const bin = BINS.find(B => span / B.ms <= iw / 2) || BINS[BINS.length - 1];
    const raw = bin.ms === STEP;
    const agg = raw ? null : aggregate(T, TL, R, i0, i1, bin.ms);
    // y domains from visible data
    let lo = Infinity, hi = -Infinity, rhi = 0;
    for (let i = i0; i < i1; i++) {
      const v = TL[i]; if (!isNaN(v)) { if (v < lo) lo = v; if (v > hi) hi = v; }
    }
    if (raw) { for (let i = i0; i < i1; i++) if (R[i] > rhi) rhi = R[i]; }
    else for (const d of agg) if (d.rain > rhi) rhi = d.rain;
    if (!isFinite(lo)) { lo = 0; hi = 1; }
    const pad = Math.max(0.5, (hi - lo) * 0.06);
    yd.domain([lo - pad, hi + pad]).nice();
    yr.domain([0, Math.max(rhi, 0.2)]).nice();

    gX.call(d3.axisBottom(xd).ticks(iw / 110).tickFormat(tickFmt).tickSizeOuter(0));
    gYT.call(d3.axisLeft(yd).ticks(7));
    gGridT.call(d3.axisLeft(yd).ticks(7).tickSize(-iw).tickFormat(""));
    gYR.call(d3.axisLeft(yr).ticks(4));
    gGridR.call(d3.axisLeft(yr).ticks(4).tickSize(-iw).tickFormat(""));
    rLabel.text(raw ? "Precip. (mm per 10 min)" : `Precip. (mm per ${bin.label})`);
    zeroD.attr("x1", 0).attr("x2", iw).attr("y1", yd(0)).attr("y2", yd(0))
      .attr("display", yd.domain()[0] < 0 && yd.domain()[1] > 0 ? null : "none");

    const rangeTxt = `${fmtFull(new Date(a))} – ${fmtFull(new Date(b))}`;
    if (raw) {
      const idx = d3.range(i0, i1);
      bandD.attr("d", null);
      lineD.attr("class", "raw").datum(idx)
        .attr("d", d3.line().defined(i => !isNaN(TL[i])).x(i => xd(T[i])).y(i => yd(TL[i])));
      const showDots = (i1 - i0) <= iw / 5;
      dotsD.selectAll("circle").data(showDots ? idx.filter(i => !isNaN(TL[i])) : [], i => i)
        .join("circle").attr("class", "dot").attr("r", 2.4).attr("cx", i => xd(T[i])).attr("cy", i => yd(TL[i]));
      const bw = Math.max(1, xd(STEP) - xd(0) - 1);
      rainG.selectAll("rect").data(idx.filter(i => R[i] > 0), i => i).join("rect").attr("class", "rain")
        .attr("x", i => xd(T[i]) - bw / 2).attr("width", bw)
        .attr("y", i => yr(R[i])).attr("height", i => RR.h - yr(R[i]));
      titleD.text(`Detail: individual 10-minute readings (line = air temperature, bars = precipitation)  ·  ${rangeTxt}`);
      hintD.text(showDots ? "dots = single 10-min readings" : "zoom in further to see single readings as dots");
    } else {
      dotsD.selectAll("circle").remove();
      const xc = d => xd(d.t + bin.ms / 2);
      bandD.datum(agg).attr("d", d3.area().defined(defd).x(xc).y0(d => yd(d.min)).y1(d => yd(d.max)));
      lineD.attr("class", "mean").datum(agg).attr("d", d3.line().defined(defd).x(xc).y(d => yd(d.mean)));
      const bw = Math.max(1, xd(bin.ms) - xd(0) - (bin.ms >= 864e5 ? 1 : 0.3));
      rainG.selectAll("rect").data(agg.filter(d => d.rain > 0), d => "a" + d.t).join("rect").attr("class", "rain")
        .attr("x", d => xd(d.t)).attr("width", bw)
        .attr("y", d => yr(d.rain)).attr("height", d => RR.h - yr(d.rain));
      titleD.text(`Detail: ${bin.label} bins of 10-minute data (band = min–max, line = mean temperature; bars = precipitation sum)  ·  ${rangeTxt}`);
      hintD.text("");
    }
  }

  // ---------- linking: brush (overview) <-> zoom (detail) ----------
  const maxK = (t1 - t0) / (STEP * 12); // allow zooming in to ~2 hours
  const zoom = d3.zoom().scaleExtent([1, maxK])
    .translateExtent([[0, 0], [iw, H]]).extent([[0, 0], [iw, RR.top + RR.h - DT.top]])
    .on("zoom", zoomed);
  const brush = d3.brushX().extent([[0, 0], [iw, OV.h]]).on("brush end", brushed);
  const gBrush = go.append("g").attr("class", "brush").call(brush);
  const zoomRect = gd.insert("rect", ":first-child").attr("width", iw).attr("height", RR.top + RR.h - DT.top)
    .attr("fill", "none").attr("pointer-events", "all").style("cursor", "move");
  zoomRect.call(zoom);
  let syncing = false;
  function brushed(e) {
    if (syncing) return;
    const s = e.selection || xo.range();
    if (!e.selection && e.type === "end") { syncing = true; gBrush.call(brush.move, xo.range()); syncing = false; }
    xd.domain(s.map(xo.invert));
    syncing = true;
    zoomRect.call(zoom.transform, d3.zoomIdentity.scale(iw / (s[1] - s[0])).translate(-s[0], 0));
    syncing = false;
    render();
  }
  function zoomed(e) {
    if (syncing) return;
    const t = e.transform;
    xd.domain(t.rescaleX(xo).domain());
    syncing = true;
    gBrush.call(brush.move, xd.range().map(t.invertX, t));
    syncing = false;
    render();
  }

  // ---------- tooltip on detail ----------
  zoomRect.on("mousemove", (e) => {
    const [mx] = d3.pointer(e);
    const tm = xd.invert(mx).getTime();
    let i = d3.bisectLeft(T, tm - STEP / 2); i = Math.min(n - 1, Math.max(0, i));
    tip.style("display", "block").style("left", (e.pageX + 12) + "px").style("top", (e.pageY - 10) + "px")
      .html(`${fmtFull(new Date(T[i]))}<br>tl: ${isNaN(TL[i]) ? "missing" : TL[i] + " °C"}<br>rr: ${isNaN(R[i]) ? "missing" : R[i] + " mm / 10 min"}`);
  }).on("mouseleave", () => tip.style("display", "none"));

  // initial selection: 3 days centred on the wettest 10-minute interval (computed)
  const c = T[rmax];
  const s0 = Math.max(t0, c - 1.5 * 864e5), s1 = Math.min(t1, c + 1.5 * 864e5);
  gBrush.call(brush.move, [xo(s0), xo(s1)]);
}
</script>
</body>
</html>
